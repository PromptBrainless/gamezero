name: Native playable

on:
  workflow_dispatch:
  push:
    paths:
      - "godot/**"
      - "data/**"
      - "src/game/slice/**"
      - "scripts/export-godot-content*"
      - "package*.json"
      - ".github/workflows/native-game.yml"
  pull_request:
    paths:
      - "godot/**"
      - "data/**"
      - "src/game/slice/**"
      - "scripts/export-godot-content*"
      - "package*.json"
      - ".github/workflows/native-game.yml"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked content-validator dependencies
        run: npm ci --ignore-scripts
      - name: Install verified Godot engine and Linux template
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 --output templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          echo "ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e  godot.zip" | sha512sum --check
          echo "8f461c7d6e91a0fbabfc95b1e4ca70ff1732c6f2920956a16b086ec2a85b5f7e238baf4dbce60dcc5630fae3bcb9a1fa2ae2027b92cb495c02d082705715e441  templates.tpz" | sha512sum --check
          unzip godot.zip
          unzip templates.tpz templates/linux_release.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp templates/linux_release.x86_64 "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Validate data and native combat/run flow
        run: |
          npm run test:slice
          timeout 180 npm run test:godot
      - name: Export standalone game and verify packaged boot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game"
          "$GODOT" --headless --path godot --editor --import --quit
          "$GODOT" --headless --path godot --export-release Linux "$RUNNER_TEMP/game/echo-bruch.x86_64"
          cd "$RUNNER_TEMP/game"
          timeout 30 ./echo-bruch.x86_64 --headless --audio-driver Dummy -- --verify-packaged-boot > boot.log 2>&1
          cat boot.log
          grep -F "Packaged boot verified: 3 careers, 4 encounters; career selection ready." boot.log
          if grep -E 'SCRIPT ERROR:|ERROR:' boot.log; then exit 1; fi
          rm boot.log
          tar -czf "$RUNNER_TEMP/echo-bruch-linux-x86_64.tar.gz" echo-bruch.x86_64
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: echo-bruch-linux-x86_64
          path: ${{ runner.temp }}/echo-bruch-linux-x86_64.tar.gz
          if-no-files-found: error
